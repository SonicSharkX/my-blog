name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.152.2'
  NODE_VERSION: '20'

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository_owner != 'HugoBlox' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so Hugo's .GitInfo and .Lastmod work
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Only set up pnpm if package.json exists in the repo
      - name: Setup pnpm
        if: ${{ hashFiles('package.json') != '' }}
        uses: pnpm/action-setup@v4

      # Install node dependencies only if package.json exists
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          # prefer pnpm if available, fall back to npm
          if command -v pnpm >/dev/null 2>&1; then
            pnpm install --frozen-lockfile || pnpm install
          else
            npm ci || npm install
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true

      # Cache dependencies (node_modules and any local modules)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/hugo_cache_runner/
            node_modules/
            modules/*/node_modules/
          key: ${{ runner.os }}-hugo-deps-${{ hashFiles('**/go.mod', '**/package-lock.json', '**/pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-hugo-deps-

      # Cache Hugo resources (processed image, css resources)
      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources/
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('assets/**/*', 'config/**/*', 'hugo.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir || true)"
          # Use the Pages base URL if configure-pages returned one
          if [ -n "${{ steps.pages.outputs.base_url }}" ]; then
            hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          else
            hugo --minify
          fi

      - name: Generate Pagefind search index (if applicable)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if grep -q "pagefind" package.json; then
            if command -v pnpm >/dev/null 2>&1; then
              pnpm dlx pagefind --source "public" || pnpm dlx @pagefind/cli --source "public"
            else
              npx pagefind --source "public" || node_modules/.bin/pagefind --source "public"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: ${{ github.repository_owner != 'HugoBlox' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        